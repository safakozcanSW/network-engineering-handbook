services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    hostname: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      cluster_net:
        ipv4_address: 10.20.1.50
    depends_on:
      - backend-1
      - backend-2

  backend-1:
    image: python:3.11-alpine
    container_name: backend-1
    hostname: backend-1
    environment:
      - SERVER_NAME=backend-01 (Kayıt Servisi)
    volumes:
      - ./backend/app.py:/app/app.py:ro
    command: python /app/app.py
    networks:
      cluster_net:
        ipv4_address: 10.20.1.61

  backend-2:
    image: python:3.11-alpine
    container_name: backend-2
    hostname: backend-2
    environment:
      - SERVER_NAME=backend-02 (Raporlama Servisi)
    volumes:
      - ./backend/app.py:/app/app.py:ro
    command: python /app/app.py
    networks:
      cluster_net:
        ipv4_address: 10.20.1.62

  ahmet-pc:
    image: alpine:latest
    container_name: ahmet-pc
    hostname: ahmet-pc
    command: sh -c "apk add --no-cache curl bind-tools && sleep infinity"
    networks:
      cluster_net:
        ipv4_address: 10.20.1.45

networks:
  cluster_net:
    name: p5_cluster_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.20.1.0/24
