events {
    worker_connections 1024;
}

http {
    # 1. Backend Sunucu Kümesi (Load Balancing Havuzu)
    upstream muhasebe_cluster {
        # least_conn: En az aktif bağlantıya sahip olan backend sunucusunu seç
        least_conn;

        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name portal.sirket.local localhost;

        location / {
            # Gelen isteği yukarıdaki cluster'a pasla:
            proxy_pass http://muhasebe_cluster;

            # ⚠️ KRİTİK PROXY BAŞLIKLARI (Header Forwarding):
            # Orijinal Host başlığını koru
            proxy_set_header Host $host;

            # Ahmet'in gerçek istemci IP adresini backend'e aktar
            proxy_set_header X-Real-IP $remote_addr;

            # Aradaki tüm vekil sunucu zincirini koru
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # İsteğin şemasını aktar (http / https)
            proxy_set_header X-Forwarded-Proto $scheme;

            # Zaman aşımı ayarları
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
    }
}
